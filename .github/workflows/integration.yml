name: Home Assistant

on:
  push:
    branches: [main]
    paths: ["custom_components/**", "tests/**", "hacs.json", ".github/workflows/integration.yml"]
  pull_request:
    paths: ["custom_components/**", "tests/**", "hacs.json"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      - run: python -m pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS prüft nur öffentliche Repos.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
