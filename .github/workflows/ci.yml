name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Changes only to the HA integration or to docs don't need an app build.
    paths-ignore:
      - "custom_components/**"
      - "tests/**"
      - "hacs.json"
      - "pytest.ini"
      - "**.md"
      - ".github/workflows/integration.yml"
  pull_request:
    paths-ignore:
      - "custom_components/**"
      - "tests/**"
      - "hacs.json"
      - "pytest.ini"
      - "**.md"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # android/ is only created by setup.py – hence a separate Gradle cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('pubspec.yaml', 'tool/setup.py') }}
          restore-keys: gradle-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up project (plugin, platforms, icons)
        run: python3 tool/setup.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Signing key (if stored as a secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key stored – release is signed with the debug key."
            exit 0
          fi
          # Missing values: alias “wash” (as in the docs), key password = keystore password.
          KEY_ALIAS="${KEY_ALIAS:-wash}"
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "Keys in keystore:"
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" | grep -i "entry" || echo "  (keystore password wrong?)"
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mv build/app/outputs/flutter-apk/app-release.apk "build/wa-sh-$VERSION.apk"
          echo "APK=build/wa-sh-$VERSION.apk" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: wa-sh-apk
          path: ${{ env.APK }}

      # Release automatically when the version in pubspec.yaml has a dated
      # changelog entry (not “unreleased”) and no release exists yet.
      # Pushing a tag v* by hand still works as well.
      - name: Release notes
        if: github.event_name == 'push'
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if grep -q "^## $VERSION – unreleased" CHANGELOG.md || ! grep -q "^## $VERSION " CHANGELOG.md; then
            echo "RELEASE=no" >> "$GITHUB_ENV"
          else
            echo "RELEASE=yes" >> "$GITHUB_ENV"
          fi

      - name: Release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && env.RELEASE == 'yes'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists – uploading the APK again."
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "wa:sh $VERSION" --notes-file release-notes.md
          fi
