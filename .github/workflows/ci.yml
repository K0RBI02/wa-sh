name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Änderungen nur an der HA-Integration oder an Texten brauchen keinen App-Build.
    paths-ignore:
      - "custom_components/**"
      - "tests/**"
      - "hacs.json"
      - "pytest.ini"
      - "**.md"
      - ".github/workflows/integration.yml"
  pull_request:
    paths-ignore:
      - "custom_components/**"
      - "tests/**"
      - "hacs.json"
      - "pytest.ini"
      - "**.md"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Projekt einrichten (Plugin, Plattformen, Icons)
        run: python3 tool/setup.py

      - name: Analyse
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Signatur-Schlüssel (falls als Secret hinterlegt)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Kein Schlüssel hinterlegt – Release wird mit dem Debug-Schlüssel signiert."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS

      - name: APK bauen
        run: flutter build apk --release

      - name: APK umbenennen
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mv build/app/outputs/flutter-apk/app-release.apk "build/wa-sh-$VERSION.apk"
          echo "APK=build/wa-sh-$VERSION.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: wa-sh-apk
          path: ${{ env.APK }}

      - name: Release (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          body_path: CHANGELOG.md
